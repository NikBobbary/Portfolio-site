<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" width="160" height="40">
  <g id="pairty-logo">
    <!-- Emblem: Interlocking Nodes / Pair Motif -->
    <defs>
      <linearGradient id="pairty-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6" />
        <stop offset="50%" stop-color="#6366F1" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>
    </defs>
    <rect x="2" y="4" width="32" height="32" rx="10" fill="#0B132B" stroke="url(#pairty-grad)" stroke-width="1.8"/>
    <circle cx="13" cy="16" r="4.5" fill="#3B82F6" />
    <circle cx="23" cy="24" r="4.5" fill="#F59E0B" />
    <path d="M13 16 C 18 16, 18 24, 23 24" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Wordmark -->
    <text x="44" y="27" font-family="'Google Sans Flex', 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5px" fill="#FFFFFF">pairty</text>
  </g>
</svg>
